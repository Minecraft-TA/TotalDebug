name: Create Release

on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Create Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build with Gradle
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}' -replace '^v', ''
          ./gradlew.bat --no-daemon clean build "-PreleaseVersion=$releaseVersion"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/TotalDebugCompanion.jar
          fail_on_unmatched_files: true

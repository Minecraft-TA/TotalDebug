name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: pwsh
        run: >-
          ./gradlew.bat clean build
          -PtotaldebugUsePublishedCompanion=true
          "-Dmaven.repo.local=$env:RUNNER_TEMP/totaldebug-empty-maven"
          --warning-mode fail --console=plain

name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test the shaded application
        shell: pwsh
        run: >-
          ./gradlew.bat clean build
          -PtotaldebugUseMavenLocal=false
          "-Dmaven.repo.local=$env:RUNNER_TEMP/companion-empty-maven"
          --warning-mode fail --console=plain

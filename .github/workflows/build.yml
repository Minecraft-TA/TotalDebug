name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        shell: pwsh
        run: >-
          ./gradlew.bat :check :localBundle
          -PtotaldebugUseMavenLocal=false
          "-Dmaven.repo.local=$env:RUNNER_TEMP/totaldebug-empty-maven"
          --warning-mode fail --console=plain
      - name: Verify configuration cache reuse
        shell: pwsh
        run: |
          ./gradlew.bat :protocol:test --warning-mode fail --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = ./gradlew.bat :protocol:test --warning-mode fail --console=plain 2>&1
          $output | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($output -join "`n") -notmatch 'Configuration cache entry reused|Reusing configuration cache') {
            throw 'The unchanged protocol task did not reuse configuration cache.'
          }

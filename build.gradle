import java.security.MessageDigest
import java.util.zip.ZipFile

abstract class VerifyCompanionPair extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getTotalDebugJar()

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getCompanionJar()

    @TaskAction
    void verify() {
        def release = new Properties()
        new ZipFile(totalDebugJar.get().asFile).withCloseable { archive ->
            def entry = archive.getEntry('META-INF/totaldebug/companion-release.properties')
            if (entry == null) {
                throw new GradleException('Built TotalDebug JAR does not contain Companion release metadata')
            }
            archive.getInputStream(entry).withCloseable { input -> release.load(input) }
        }

        def embeddedSha256 = release.getProperty('sha256')
        def actualSha256 = sha256(companionJar.get().asFile)
        if (embeddedSha256 != actualSha256) {
            throw new GradleException(
                    "Companion pair mismatch: TotalDebug pins ${embeddedSha256}, but "
                            + "${companionJar.get().asFile} has ${actualSha256}"
            )
        }
        logger.lifecycle("Verified TotalDebug and Companion pair at SHA-256 ${actualSha256}")
    }

    static String sha256(File input) {
        def digest = MessageDigest.getInstance('SHA-256')
        input.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        HexFormat.of().formatHex(digest.digest())
    }
}

abstract class CompanionSha256ArgumentProvider implements CommandLineArgumentProvider {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getCompanionJar()

    @Override
    Iterable<String> asArguments() {
        ["-Dtotaldebug.test.companionSha256=${VerifyCompanionPair.sha256(companionJar.get().asFile)}"]
    }
}

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = 'com.github.minecraft_ta'

base {
    archivesName = 'total_debug'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven {
        name = 'Parchment'
        url = uri('https://maven.parchmentmc.org')
        content {
            includeGroup 'org.parchmentmc.data'
        }
    }
    maven {
        name = 'JEI'
        url = uri('https://maven.blamejared.com')
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'tth05'
        url = uri('https://packagecloud.io/tth05/repo/maven2')
        content {
            includeGroup 'com.github.tth05'
        }
    }
    mavenLocal()
}

def explicitCompanionJar = providers.gradleProperty('totaldebugCompanionJar')
def usePublishedCompanion = providers.gradleProperty('totaldebugUsePublishedCompanion')
        .map { value -> value.toBoolean() }
        .orElse(false)
def codexHome = providers.gradleProperty('codexHome')
        .orElse(providers.environmentVariable('CODEX_HOME'))
        .orElse(providers.systemProperty('user.home').map { home -> "${home}/.codex" })
def siblingCompanionDirectory = layout.projectDirectory.dir('../TotalDebugCompanion')
def siblingCompanionBuildFile = siblingCompanionDirectory.file('build.gradle')
def siblingCompanionWrapper = siblingCompanionDirectory.file(
        System.getProperty('os.name', '').toLowerCase(Locale.ROOT).startsWith('windows')
                ? 'gradlew.bat'
                : 'gradlew'
)
def siblingCompanionJar = siblingCompanionDirectory.file('build/libs/TotalDebugCompanion.jar')
def useSiblingCompanion = !explicitCompanionJar.isPresent()
        && !usePublishedCompanion.get()
        && siblingCompanionBuildFile.asFile.isFile()
        && siblingCompanionWrapper.asFile.isFile()
def pairedCompanionJar = explicitCompanionJar.isPresent()
        ? file(explicitCompanionJar.get())
        : useSiblingCompanion ? siblingCompanionJar.asFile : null
def pairedCompanionSha256 = pairedCompanionJar == null
        ? null
        : providers.provider { VerifyCompanionPair.sha256(pairedCompanionJar) }

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            if (explicitCompanionJar.isPresent()) {
                systemProperty 'totaldebug.companionJar', file(explicitCompanionJar.get()).absolutePath
            } else if (useSiblingCompanion) {
                systemProperty 'totaldebug.companionJar', siblingCompanionJar.asFile.absolutePath
            }
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        total_debug {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo sourceSets.test
}

def buildSiblingCompanion = tasks.register('buildSiblingCompanion', Exec) {
    group = 'development'
    description = 'Builds the sibling TotalDebugCompanion JAR used by development clients.'
    onlyIf { useSiblingCompanion }
    workingDir siblingCompanionDirectory.asFile
    commandLine siblingCompanionWrapper.asFile.absolutePath, 'shadowJar', '--console=plain'
}

tasks.named('prepareClientRun').configure {
    if (useSiblingCompanion) {
        dependsOn buildSiblingCompanion
    }
}

tasks.named('runClient').configure {
    if (useSiblingCompanion) {
        dependsOn buildSiblingCompanion
    }
}

dependencies {
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"

    def embeddedLibraries = [
            "com.github.tth05:SCNet:${scnet_version}",
            "io.github.classgraph:classgraph:${classgraph_version}",
    ]
    embeddedLibraries.each { library ->
        implementation library
        jarJar library
        additionalRuntimeClasspath library
    }

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def minimumNeoForgeVersion = project.neo_version.toString()

tasks.named('processResources').configure {
    inputs.property('neo_version', minimumNeoForgeVersion)
    if (pairedCompanionJar != null) {
        if (useSiblingCompanion) {
            dependsOn buildSiblingCompanion
        }
        inputs.file(pairedCompanionJar).withPathSensitivity(PathSensitivity.NONE)
        filesMatching('META-INF/totaldebug/companion-release.properties') {
            filter { line ->
                line.startsWith('sha256=')
                        ? "sha256=${pairedCompanionSha256.get()}"
                        : line
            }
        }
    }
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('${neo_version}', minimumNeoForgeVersion) }
    }
}

def modJar = tasks.named('jar', Jar)

modJar.configure {
    manifest.attributes(
            'Implementation-Title': 'TotalDebug',
            'Implementation-Version': project.version,
    )
}

def verifyCompanionPair = pairedCompanionJar == null
        ? tasks.register('verifyCompanionPair') {
            group = 'verification'
            description = 'Checks that the built TotalDebug JAR pins the selected local Companion JAR.'
            onlyIf { false }
        }
        : tasks.register('verifyCompanionPair', VerifyCompanionPair) {
            group = 'verification'
            description = 'Checks that the built TotalDebug JAR pins the selected local Companion JAR.'
            totalDebugJar = modJar.flatMap { it.archiveFile }
            companionJar = pairedCompanionJar
            dependsOn modJar
        }

tasks.named('check').configure {
    dependsOn verifyCompanionPair
}

if (pairedCompanionJar != null) {
    def localCompanionPair = tasks.register('localCompanionPair', Sync) {
        group = 'build'
        description = 'Builds and collects matching local TotalDebug and Companion JARs.'
        dependsOn verifyCompanionPair
        from(modJar.flatMap { it.archiveFile })
        from(pairedCompanionJar)
        into(layout.buildDirectory.dir('local-companion-pair'))
    }

    tasks.register('installCodexCompanionMcp', Copy) {
        group = 'development'
        description = 'Builds a verified local pair and installs the Companion MCP sidecar for Codex.'
        dependsOn localCompanionPair
        from(layout.buildDirectory.file('local-companion-pair/TotalDebugCompanion.jar'))
        into(codexHome.map { home -> new File(home, 'mcp/totaldebug-companion') })
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (pairedCompanionJar != null) {
        def sha256ArgumentProvider = objects.newInstance(CompanionSha256ArgumentProvider)
        sha256ArgumentProvider.companionJar = pairedCompanionJar
        jvmArgumentProviders.add(sha256ArgumentProvider)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = "com.github.minecraft_ta"
version = providers.gradleProperty('releaseVersion').orElse('2.0.0-SNAPSHOT').get()

repositories {
    if (providers.gradleProperty('useMavenLocal').orNull == 'true') {
        mavenLocal()
    }
    mavenCentral()
    maven { url = uri('https://packagecloud.io/tth05/repo/maven2') }
}

dependencies {
    implementation("com.github.tth05:jindex:${jindex_version}")
    implementation("com.github.tth05:SCNet:${scnet_version}")

    implementation('com.formdev:flatlaf:3.7.2')
    implementation('com.formdev:flatlaf-intellij-themes:3.7.2')
    implementation('com.formdev:flatlaf-extras:3.7.2')
    implementation('com.fifesoft:rsyntaxtextarea:4.0.1')
    implementation('com.fifesoft:autocomplete:3.3.3')

    implementation('org.apache.commons:commons-compress:1.28.0')
    implementation('com.google.code.gson:gson:2.14.0')
    implementation('org.eclipse.jdt:org.eclipse.jdt.core:3.46.0') {
        exclude group: "org.eclipse.platform", module: "org.eclipse.equinox.app"
        exclude group: "org.eclipse.platform", module: "org.eclipse.core.filesystem"
        exclude group: "org.eclipse.platform", module: "org.eclipse.core.commands"
    }
    compileOnly('org.osgi:org.osgi.service.component.annotations:1.5.1')

    testImplementation('org.junit.jupiter:junit-jupiter:6.1.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:6.1.3')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.named('jar') {
    archiveClassifier = 'plain'
}

tasks.named('shadowJar') {
    archiveFileName = "${rootProject.name}.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    failOnDuplicateEntries = true
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
    manifest {
        attributes 'Main-Class': 'com.github.minecraft_ta.totalDebugCompanion.CompanionApp'
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    useJUnitPlatform()
}

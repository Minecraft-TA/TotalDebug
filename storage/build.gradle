plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.minecraft_ta'
version = rootProject.version

base {
    archivesName = 'totaldebug-storage'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Both applications already provide Gson; do not embed another copy in Minecraft.
    compileOnly 'com.google.code.gson:gson:2.14.0'
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

publishing {
    publications {
        storage(MavenPublication) {
            artifactId = 'totaldebug-storage'
            from components.java
            pom {
                name = 'TotalDebug Storage'
                description = 'Shared profile, catalog and storage contracts for TotalDebug and Companion.'
            }
        }
    }
}

apply from: rootProject.file('gradle/packagecloud-publishing.gradle')

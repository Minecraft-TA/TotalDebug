import totaldebug.gradle.GenerateThirdPartyNotices
import totaldebug.gradle.GenerateParchmentParameterIndex

plugins {
    id 'totaldebug.java-conventions'
    alias(libs.plugins.shadow)
}

configurations {
    parchmentData
}

dependencies {
    implementation project(':protocol')
    implementation project(':storage')
    implementation project(':evaluation')
    parchmentData libs.parchment

    implementation platform(libs.mcp.bom)
    implementation(libs.mcp)
    implementation(libs.tomcat)

    implementation(libs.jna.desktop)
    implementation(libs.jindex)
    implementation(libs.scnet)

    implementation(libs.flatlaf)
    implementation(libs.flatlaf.themes)
    implementation(libs.flatlaf.extras)
    // Version numbers here track the font release, not FlatLaf.
    implementation(libs.font.inter)
    implementation(libs.font.jetbrains)
    implementation(libs.rsyntaxtextarea)
    implementation(libs.autocomplete)

    implementation(libs.commons.compress)
    implementation(libs.gson)
    implementation(libs.asm.desktop)
    implementation(variantOf(libs.vineflower) { classifier('slim') })
    implementation(libs.java.debug)
    implementation(libs.jdt) {
        exclude group: "org.eclipse.platform", module: "org.eclipse.equinox.app"
        exclude group: "org.eclipse.platform", module: "org.eclipse.core.filesystem"
        exclude group: "org.eclipse.platform", module: "org.eclipse.core.commands"
    }
    compileOnly(libs.osgi.annotations)

}

def generatedParchmentResources = layout.buildDirectory.dir('generated/resources/parchment')
def generateParchmentParameterIndex = tasks.register(
        'generateParchmentParameterIndex',
        GenerateParchmentParameterIndex
) {
    parchmentArchive.fileProvider(configurations.named('parchmentData').flatMap { configuration ->
        configuration.elements.map { files ->
            if (files.size() != 1) {
                throw new GradleException("Expected one Parchment data artifact, found ${files.size()}")
            }
            files.iterator().next().asFile
        }
    })
    minecraftVersion = libs.versions.minecraft.get()
    mappingsVersion = libs.versions.parchment.get()
    outputFile = generatedParchmentResources.map {
        it.file('totaldebug/parchment-parameters.bin')
    }
}

sourceSets.main.resources.srcDir(generatedParchmentResources)


tasks.named('jar') {
    archiveClassifier = 'plain'
}

def thirdPartyNotices = tasks.register('generateThirdPartyNotices', GenerateThirdPartyNotices) {
    dependencyArchives.from(configurations.runtimeClasspath)
    outputDirectory = layout.buildDirectory.dir('generated-resources/third-party-notices')
}

tasks.named('shadowJar') {
    from(thirdPartyNotices) { into 'META-INF/third-party' }
    dependsOn generateParchmentParameterIndex
    archiveFileName = 'TotalDebugCompanion.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    failOnDuplicateEntries = true
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
    manifest {
        attributes 'Main-Class': 'com.github.minecraft_ta.totalDebugCompanion.CompanionApp'
    }
}

tasks.named('processResources') {
    dependsOn generateParchmentParameterIndex
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'totaldebug.testClasspath', sourceSets.test.runtimeClasspath.asPath
}

// Brings the UI up without a Minecraft session so themes and icons can be eyeballed.
tasks.register('uiHarness', JavaExec) {
    group = 'application'
    description = 'Runs the Companion UI without a Minecraft session (see UiDevHarness).'
    workingDir = layout.projectDirectory.asFile
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.minecraft_ta.totalDebugCompanion.UiDevHarness'
}

tasks.register('uiContactSheet', JavaExec) {
    group = 'verification'
    description = 'Renders every named Companion UI state in both themes.'
    workingDir = layout.projectDirectory.asFile
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.minecraft_ta.totalDebugCompanion.UiCaptureSuite'
}

// Runs the debugger engine against real child JVMs without starting the Companion UI.
tasks.register('debuggerHarness', JavaExec) {
    group = 'verification'
    description = 'Runs the reusable real-JDWP debugger scenario suite (see DebuggerDevHarness).'
    workingDir = layout.projectDirectory.asFile
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.github.minecraft_ta.totalDebugCompanion.DebuggerDevHarness'
}

configurations.create('executableElements') { canBeConsumed = true; canBeResolved = false }
artifacts { executableElements tasks.named('shadowJar') }

tasks.register('packagingTest', totaldebug.gradle.VerifyCompanionJar) {
    group = 'verification'
    executableJar = tasks.named('shadowJar').flatMap { it.archiveFile }
    reportFile = layout.buildDirectory.file('reports/packaging.txt')
}
tasks.named('check') { dependsOn tasks.named('packagingTest') }

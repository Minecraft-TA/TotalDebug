plugins {
    id 'totaldebug.java-conventions'
    id 'net.neoforged.moddev'
    id 'idea'
}
base { archivesName = 'total_debug' }
def explicitCompanionJar = providers.gradleProperty('totaldebugCompanionJar')
def usePublishedCompanion = providers.gradleProperty('totaldebugUsePublishedCompanion').map { it.toBoolean() }.orElse(false)
def companionExecutable = configurations.create('companionExecutable') {
    canBeConsumed = false
    canBeResolved = true
}
dependencies { add('companionExecutable', project(path: ':companion', configuration: 'executableElements')) }
def minecraftDebugPort = providers.gradleProperty('totaldebugMinecraftDebugPort').map { value ->
    int port
    try {
        port = Integer.parseInt(value)
    } catch (NumberFormatException exception) {
        throw new GradleException("totaldebugMinecraftDebugPort must be an integer", exception)
    }
    if (port < 0 || port > 65535) {
        throw new GradleException("totaldebugMinecraftDebugPort must be between 0 and 65535")
    }
    return port
}

neoForge {
    version = libs.versions.neoforge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    runs {
        client {
            client()
            systemProperty 'totaldebug.workspaceRoot', rootDir.absolutePath
            if (minecraftDebugPort.isPresent()) {
                jvmArgument(
                        "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,"
                                + "address=127.0.0.1:${minecraftDebugPort.get()}"
                )
            }
            if (explicitCompanionJar.isPresent()) {
                systemProperty 'totaldebug.companionJar', file(explicitCompanionJar.get()).absolutePath
            } else if (!usePublishedCompanion.get()) {
                systemProperties.put('totaldebug.companionJar', companionExecutable.elements.map { it.iterator().next().asFile.absolutePath })
            }
        }

        server {
            server()
            systemProperty 'totaldebug.workspaceRoot', rootDir.absolutePath
            programArgument '--nogui'
        }
    }

    mods {
        total_debug {
            sourceSet(sourceSets.main)
        }
    }

    addModdingDependenciesTo sourceSets.test
}


if (!explicitCompanionJar.isPresent() && !usePublishedCompanion.get()) {
    tasks.named('prepareClientRun') { dependsOn companionExecutable }
}
dependencies {
    implementation project(':evaluation')
    jarJar project(':evaluation')
    additionalRuntimeClasspath project(':evaluation')
    implementation project(':storage')
    jarJar project(':storage')
    additionalRuntimeClasspath project(':storage')
    compileOnly libs.jna.mod
    compileOnly libs.jei.api
    implementation libs.asm.mod
    implementation libs.asm.tree

    def embeddedLibraries = [
            libs.scnet,
            libs.classgraph,
    ]
    embeddedLibraries.each { library ->
        implementation library
        jarJar library
        additionalRuntimeClasspath library
    }

    testImplementation libs.asm.mod
    testImplementation libs.jei.api
}

def minimumNeoForgeVersion = libs.versions.neoforge.get()

tasks.named('processResources').configure {
    inputs.property('neo_version', minimumNeoForgeVersion)
    filesMatching('META-INF/neoforge.mods.toml') {
        filter { line -> line.replace('${neo_version}', minimumNeoForgeVersion) }
    }
}

def modJar = tasks.named('jar', Jar)

modJar.configure {
    manifest.attributes(
            'Implementation-Title': 'TotalDebug',
            'Implementation-Version': project.version,
    )
}


configurations.create('modElements') { canBeConsumed = true; canBeResolved = false }
artifacts { modElements modJar }
sourceSets { packagingTest }
neoForge.addModdingDependenciesTo sourceSets.packagingTest
configurations {
    packagingTestImplementation.extendsFrom testImplementation
    packagingTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('packagingTest', Test) {
    testClassesDirs = sourceSets.packagingTest.output.classesDirs
    classpath = sourceSets.packagingTest.runtimeClasspath
    inputs.file(modJar.flatMap { it.archiveFile }).withPropertyName('packagedMod')
    jvmArgumentProviders.add(new totaldebug.gradle.PackagedModArgumentProvider(modJar.flatMap { it.archiveFile }))
}
tasks.named('check') { dependsOn tasks.named('packagingTest') }
tasks.named('test', Test) {
    jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
}
idea { module { downloadSources = true; downloadJavadoc = true } }
